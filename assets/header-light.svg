<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Manal Aros, software engineer</title>
  <desc id="desc">Introduction banner for Manal Aros with soft blue, purple and gray light.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="340" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#base)"/>

    <g filter="url(#soft)" opacity="0.78">
      <circle r="135" fill="#60A5FA" cx="680" cy="75">
        <animate attributeName="cx" values="680;780;680" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="75;165;75" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="125" fill="#A78BFA" cx="860" cy="125">
        <animate attributeName="cx" values="860;750;860" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="125;45;125" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle r="120" fill="#94A3B8" cx="820" cy="292">
        <animate attributeName="cx" values="820;920;820" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="292;235;292" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle r="95" fill="#818CF8" cx="540" cy="300">
        <animate attributeName="cx" values="540;640;540" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;250;300" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1000" height="340" fill="url(#shade)"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
      <text x="64" y="150" font-size="30" font-weight="500" fill="#475569">Hi, I'm</text>
      <text x="62" y="236" font-size="96" font-weight="700" letter-spacing="-3" fill="#1E293B">Manal Aros</text>
      <text x="64" y="288" font-size="25" font-weight="400" fill="#475569">Software engineer · curious mind · thoughtful builder</text>
    </g>
  </g>
</svg>
