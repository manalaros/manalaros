<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Manal Aros — software engineer</title>
  <desc id="desc">A clean blue and purple introduction banner for Manal Aros.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <circle cx="1030" cy="40" r="150" fill="#93C5FD" fill-opacity="0.46" filter="url(#blur)"/>
    <circle cx="1040" cy="320" r="170" fill="#C4B5FD" fill-opacity="0.42" filter="url(#blur)"/>
    <rect x="56" y="52" width="8" height="236" rx="4" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="100" y="126" font-size="27" font-weight="500" fill="#64748B">Hi, I'm</text>
      <text x="96" y="218" font-size="92" font-weight="750" letter-spacing="-4" fill="#1E293B">Manal Aros</text>
      <text x="102" y="270" font-size="24" font-weight="500" fill="#64748B">Software engineer · curious mind · thoughtful builder</text>
    </g>
    <circle cx="1060" cy="108" r="10" fill="#2563EB"/>
    <circle cx="1090" cy="138" r="6" fill="#7C3AED"/>
    <circle cx="1028" cy="150" r="7" fill="#64748B"/>
  </g>
</svg>
