<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Manal Aros — software engineer</title>
  <desc id="desc">A modern blue, purple, and gray introduction banner for Manal Aros.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#020617" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="340" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#base)"/>
    <g filter="url(#soft)" opacity="0.9">
      <circle r="135" fill="#2563EB" cx="690" cy="72">
        <animate attributeName="cx" values="690;760;690" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="72;150;72" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="125" fill="#7C3AED" cx="850" cy="125">
        <animate attributeName="cx" values="850;760;850" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="125;52;125" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle r="120" fill="#64748B" cx="820" cy="292">
        <animate attributeName="cx" values="820;900;820" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="292;230;292" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle r="95" fill="#60A5FA" cx="525" cy="35"/>
    </g>
    <rect width="1000" height="340" fill="url(#shade)"/>
    <rect x="64" y="66" width="7" height="220" rx="3.5" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="106" y="143" font-size="30" font-weight="500" fill="#CBD5E1">Hi, I'm</text>
      <text x="104" y="232" font-size="96" font-weight="700" letter-spacing="-3" fill="#F8FAFC">Manal Aros</text>
      <text x="108" y="286" font-size="25" font-weight="400" fill="#CBD5E1">Software engineer · curious mind · thoughtful builder</text>
    </g>
    <circle cx="900" cy="82" r="9" fill="#60A5FA"/>
    <circle cx="930" cy="112" r="6" fill="#A78BFA"/>
    <circle cx="870" cy="122" r="7" fill="#94A3B8"/>
  </g>
</svg>
