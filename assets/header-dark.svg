<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Manal Aros — software engineer</title>
  <desc id="desc">A colorful, modern introduction banner for Manal Aros.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset="1" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="52"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="32"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#background)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <g filter="url(#blur)">
      <circle cx="980" cy="48" r="150" fill="#2563EB" fill-opacity="0.58"/>
      <circle cx="1080" cy="300" r="170" fill="#DB2777" fill-opacity="0.42"/>
      <circle cx="760" cy="350" r="125" fill="#7C3AED" fill-opacity="0.48"/>
    </g>
    <rect x="48" y="48" width="1104" height="284" rx="24" fill="#09090B" fill-opacity="0.46" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="48" y="48" width="8" height="284" rx="4" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="96" y="142" font-size="28" font-weight="500" fill="#CBD5E1">Hi, I'm</text>
      <text x="92" y="234" font-size="94" font-weight="750" letter-spacing="-4" fill="#FFFFFF">Manal Aros</text>
      <text x="98" y="286" font-size="25" font-weight="500" fill="#CBD5E1">Software engineer · curious mind · thoughtful builder</text>
    </g>
    <circle cx="1062" cy="112" r="10" fill="#60A5FA"/>
    <circle cx="1092" cy="142" r="6" fill="#F472B6"/>
    <circle cx="1030" cy="154" r="7" fill="#A78BFA"/>
  </g>
</svg>
