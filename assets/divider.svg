<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" width="1000" height="6" role="presentation">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.25" stop-color="#BF5AF2"/>
      <stop offset="0.5" stop-color="#FF375F"/>
      <stop offset="0.75" stop-color="#FF9F0A"/>
      <stop offset="1" stop-color="#0A84FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="6" rx="3" fill="url(#flow)"/>
</svg>
